<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Scriptorium wordmark</title>
  <desc id="desc">Scriptorium wordmark with the tagline Precision Across Languages.</desc>
  <rect width="1200" height="360" fill="#F7F4EB"/>
  <rect x="52" y="48" width="256" height="256" fill="none" stroke="#B8932F" stroke-width="8"/>
  <rect x="70" y="66" width="220" height="220" fill="none" stroke="#D9C583" stroke-width="3"/>
  <text x="132" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="188" fill="#24313A">S</text>
  <text x="352" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="6" fill="#24313A">SCRIPTORIUM</text>
  <line x1="356" y1="196" x2="1088" y2="196" stroke="#B8932F" stroke-width="4"/>
  <text x="510" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="8" fill="#476A78">PRECISION ACROSS LANGUAGES</text>
